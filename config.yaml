# derawtisation_pipe — configuration
# ─────────────────────────────────────
# All tunable parameters live here. No need to touch the pipeline scripts
# to change thresholds, paths, or output settings.
# Lines starting with # are comments explaining why a value exists.


# ── PATHS ────────────────────────────────────────────────────────────────────

# Folder containing the RAW files to process (NEF and DNG)
# Can be a local path or a mapped network drive path (e.g. H:\...)
input_dir: "C:/Users/iconem/Desktop/mpr_full_raw"

# Where pipeline outputs (CSVs, correction matrices, exported JPEGs) will go
# A timestamped subfolder is created automatically inside this folder per run
output_dir: "C:/Users/iconem/Desktop/mpr_output_full"

# Path to RawTherapee CLI executable
# On Windows this is typically in Program Files
rawtherapee_cli: "C:/Program Files/RawTherapee/5.8/rawtherapee-cli.exe"


# ── CAMERA GROUPS ────────────────────────────────────────────────────────────

# Maps filename prefix to a group identifier used throughout the pipeline.
# Group is the unit for computing color correction matrices.
# See DECISIONS.md D003 for why we group per card rather than per camera model.
camera_groups:
  N02:  { camera: "Nikon D850",  card: "146ND850",  flash: "godox_external" }
  R004: { camera: "Ricoh GR II", card: "100_0512",  flash: "ricoh_native" }
  R100: { camera: "Ricoh GR II", card: "104RICOH",  flash: "ricoh_native" }
  R105: { camera: "Ricoh GR II", card: "111RICOH",  flash: "ricoh_native" }

# The reference group — all other groups are normalized to match this one.
# See DECISIONS.md D004 for why Nikon is the reference.
reference_group: "N02"


# ── BLUR CULLING ─────────────────────────────────────────────────────────────

# Sharpness thresholds per camera group (Laplacian variance).
# Nikon D850 scores lower than Ricoh due to higher pixel density on half-size
# decode — thresholds are not comparable across sensors. See DECISIONS.md D009.
blur_thresholds:
  N02:  55
  R004: 80
  R100: 80
  R105: 80

# Fallback threshold for any group not listed above
blur_threshold_default: 80

# A frame is also rejected if flash did not fire (FlashMode contains "Did not fire")
# regardless of sharpness score. See DECISIONS.md D005.
reject_no_flash: true


# ── COLORCHECKER DETECTION ───────────────────────────────────────────────────

# Minimum confidence score from colour-checker-detection to accept a detection.
# Range 0.0–1.0. Below this value the detection is discarded for that frame.
checker_confidence_min: 0.85

# The ColorChecker reference — which chart standard to compare against.
# "Classic" = original 24-patch Macbeth ColorChecker
checker_reference: "Classic"

# Color space used as the common target for normalization.
# "sRGB" is correct for JPEG output going into photogrammetry software.
target_colorspace: "sRGB"

# ── Scan performance / resumability (step 03) ──
# Step 03 decodes every RAW at half-size to find the chart. On the full ~2500-file
# dataset this is the slow part, so it runs in parallel and caches every file's
# result to scan_cache.jsonl in the run folder. Re-running the SAME run_id resumes:
# already-scanned files (matched on path+size+mtime) are skipped, so a crash or
# network drop never loses progress.
scan_workers: 12         # parallel decode+detect processes. Tune to your CPU;
                         # 8 is safe on most machines (each worker holds one
                         # decoded frame in RAM and is CPU-heavy). 12 suits the
                         # full local scan on a many-core box + fast local disk.
scan_progress_every: 50  # print a progress line every N files scanned


# ── NORMALIZATION (step 04) ──────────────────────────────────────────────────
# Turns the ColorChecker detections from step 03 into one color-correction
# matrix (CCM) + white-balance multipliers per camera group.
normalization:

  # Which ColorChecker standard the reference patch values come from.
  # colour-science ships several. The Calibrite ColorChecker Passport uses the
  # post-November-2014 values, so that is the correct reference for this shoot.
  # (config.yaml's checker_reference: "Classic" is the human label; this is the
  # exact colour-science key it maps to.)
  checker_standard: "ColorChecker24 - After November 2014"

  # Patch indices (0-based, standard ColorChecker order) used to derive white
  # balance. The bottom row is the neutral grey ramp:
  #   18=white (clips easily), 19=N8, 20=N6.5, 21=N5, 22=N3.5, 23=black (noisy).
  # We use the three middle-light greys — bright enough to be clean, not clipped.
  wb_neutral_indices: [19, 20, 21]

  # Trust gates on the fit quality, measured as mean ΔE2000 across the 24 patches
  # AFTER applying the computed CCM. This is the real quality signal — step 03's
  # "confidence" only means "found 24 patches", not "the colors are clean".
  #   mean ΔE <= warn            -> trusted
  #   warn < mean ΔE <= reject   -> used, but flagged low_confidence (eyeball it)
  #   mean ΔE > reject           -> detection thrown out (likely glare / shadow /
  #                                 wrong orientation); group falls back to borrow.
  residual_deltaE_warn: 5.0
  residual_deltaE_reject: 10.0

  # Borrow hierarchy — see DECISIONS.md D010.
  # If a group has NO usable detection, it inherits the CCM of the first group
  # in its list that DOES have a trusted matrix. Order encodes physical similarity:
  # the 3 Ricoh bodies share the same sensor + native flash, so they borrow each
  # other first; Nikon (different Godox flash) is only a last resort.
  # Nikon borrowing a Ricoh is an EMERGENCY — the reference group having no checker
  # undermines the whole normalization and should trigger a re-shoot, not a silent fix.
  fallback_order:
    N02:  ["R100", "R004", "R105"]
    R004: ["R100", "R105", "N02"]
    R100: ["R004", "R105", "N02"]
    R105: ["R004", "R100", "N02"]


# ── RAW EXPORT ───────────────────────────────────────────────────────────────

# JPEG quality for exported files. 100 = least-aggressive JPEG (largest files).
# Combined with 4:4:4 chroma (no colour subsampling, set in render_common) this
# keeps the export as close to lossless as JPEG allows — good for a colour pipeline.
# 95 is the usual photogrammetry standard if you want smaller files.
jpeg_quality: 100

# Parallel RawTherapee-develop + correct workers for step 06 (the export batch).
# Each worker runs one rawtherapee-cli process and holds one 16-bit TIFF in RAM,
# so keep this lower than the step-03 scan workers. Re-running step 06 skips
# frames whose JPEG already exists, so a killed batch resumes cheaply.
render_workers: 6

# Output color profile embedded in exported JPEGs.
output_profile: "sRGB"

# Whether to also export a full-resolution TIFF alongside the JPEG.
# Disabled by default — JPEGs are sufficient for RealityCapture/Metashape.
# See DECISIONS.md D007.
export_tiff: false


# ── QC REPORT ────────────────────────────────────────────────────────────────

# A frame is flagged as an outlier in the QC report if its mean luminance
# deviates from the group median by more than this factor.
# e.g. 0.3 means flag if luminance is 30% above or below group median.
qc_luminance_tolerance: 0.3